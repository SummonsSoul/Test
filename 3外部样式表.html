    <h1>若乃山河阻绝，飘零离别。拔本垂泪，伤根沥血。</h1>
    <p>火入空心，膏流断节。横洞口而敧卧，顿山腰而半折，文斜者百围冰碎，理正者千寻瓦裂。</p>
    <span>载瘿衔瘤，藏穿抱穴，木魅睒睗，山精妖孽。</span>

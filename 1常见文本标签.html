<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我是杨钦允</title>
</head>
<body>
    <h1>我是杨钦允</h1>
    <h2>学习HTML</h2>
    <h3>HTML基础</h3>
    <p>HTML（超文本标记语言）是构建网页的基础。它使用标签来定义网页的结构和内容。</p>
    <p><i>i是斜体</i><u>u是下划线</u><b>b是粗体</b><strong>strong也是加粗</strong></p>
    <p>ul是无序列表</p>
    <ul>
        <li>列表项1</li>
        <li>列表项2</li>
        <li>列表项3</li>
    </ul>
    <p>ol是有序列表</p>
    <ol>
        <li>列表项1</li>
        <li>列表项2</li>
        <li>列表项3</li>
    </ol>
    <table border="10">
        <th>表格标题1</th>
        <th>表格标题2</th>
        <th>表格标题33</th>
        <tr>
        <td>1</td>
        <td>2</td>
        <td>3</td>
        </tr>
        <tr>
        <td>1</td>
        <td>2</td>
        <td>3</td>
        </tr>
        <tr>
        <td>1</td>
        <td>2</td>
        <td>3</td>
        </tr>
    </table>
</body>
</html>

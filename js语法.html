<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
// 声明变量
    var x
    let y=5
    const pi=3.14
    console.log(x) // undefined（未赋值的变量默认值为undefined）
    console.log(y) // 5
    console.log(pi) // 3.14
    let name = '名字'// 这是一个字符串
    console.log(name) // 名字

    for (let i = 0; i < 5; i++) {
        console.log(i) // 0, 1, 2, 3, 4
    }
    function HOLLYWOOD(){
        console.log('HOLLYWORLD')
    }

    HOLLYWOOD()
    // 调用函数
    </script>
    
</body>
</html>
